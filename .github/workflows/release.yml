# Publishes op-env-sync to PyPI via trusted publishing (OIDC — no stored token).
#
# One-time setup on https://pypi.org/manage/account/publishing/ (and the same on
# test.pypi.org): add a "pending publisher" for owner `swils23`, repository
# `op-env-sync`, workflow `release.yml`, environment `pypi` (or `testpypi`).
#
# Release: bump __version__ in op_env_sync.py, commit, then
#     git tag v0.1.0 && git push origin v0.1.0
# Rehearse on TestPyPI first from the Actions tab (Run workflow → target: testpypi).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Check the tag matches __version__
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' op_env_sync.py)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ = $version"
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - name: Smoke-test the wheel
        run: uvx --from dist/*.whl op-env-sync --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          # This job never checks the repo out (it only publishes the built artifact),
          # so there is no lockfile to key a cache on and the workdir starts empty.
          enable-cache: false
          ignore-empty-workdir: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        run: uv publish --publish-url https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'pypi'
        run: uv publish

  github-release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release with the wheel and sdist attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
